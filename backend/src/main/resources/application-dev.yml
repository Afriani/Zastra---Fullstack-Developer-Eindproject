    client:
      id: ${FACEBOOK_CLIENT_ID:dummy}
      secret: ${FACEBOOK_CLIENT_SECRET:dummy}

  # Google OAuth Configuration
  google:
    client:
      id: ${GOOGLE_CLIENT_ID:dummy}
      secret: ${GOOGLE_CLIENT_SECRET:dummy}

  # Frontend URL for OAuth redirects
  app:
    frontend-url: http://localhost:5173

