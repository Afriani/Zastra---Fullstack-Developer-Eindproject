spring:
  application:
    name: Zastra

  profiles:
    # ✅ This tells Spring: "Use the SPRING_PROFILES_ACTIVE variable from Render,
    # but if it's missing (like on my laptop), use 'dev' as a fallback."
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # Disable Spring Boot default DataSource autoconfig (kills postgres fallback)
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration

  datasource:
    zastra:
      url: ${ZASTRA_DB_URL:jdbc:postgresql://localhost:5432/zastra_db}
      username: ${ZASTRA_DB_USERNAME:postgres}
      password: ${ZASTRA_DB_PASSWORD:password}
      driver-class-name: org.postgresql.Driver
      hikari:
        maximum-pool-size: 5        # keep low for Neon free tier
        minimum-idle: 1
        connection-timeout: 30000
        data-source-properties:
          prepareThreshold: 0       # ✅ disables server-side prepared statements (required for pgbouncer)

    media:
      url: ${MEDIA_DB_URL:jdbc:postgresql://localhost:5432/media_db}
      username: ${MEDIA_DB_USERNAME:postgres}
      password: ${MEDIA_DB_PASSWORD:password}
      driver-class-name: org.postgresql.Driver
      hikari:
        maximum-pool-size: 5
        minimum-idle: 1
        connection-timeout: 30000
        data-source-properties:
          prepareThreshold: 0       # ✅ required for pgbouncer/Neon

  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 500MB

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time-zone: UTC

  jackson:
    serialization:
      write-dates-as-timestamps: false

  # Email Configuration
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${GMAIL_USERNAME:dummy@gmail.com}
    password: ${GMAIL_PASSWORD:dummy_password}
    properties:
      mail:
      smtp:
        auth: true
        starttls:
          enable: true
          required: true
        connectiontimeout: 5000
        timeout: 5000
        writetimeout: 5000
      default-encoding: UTF-8

server:
  port: ${PORT:8080}
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: always

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:myVerySecretKeyForJWTTokenGenerationThatShouldBeLongEnough}
  expiration: 86400000 # 24 hours in milliseconds

# File Upload Configuration
file:
  upload-dir: ${FILE_UPLOAD_DIR:./uploads}

# Application URLs
app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}

# Logging
logging:
  level:
    com.zastra: DEBUG
    org.hibernate.SQL: DEBUG
    org.springframework: INFO
    com.zaxxer.hikari.HikariConfig: DEBUG   # show each pool config
    com.zaxxer.hikari: TRACE                # show connection acquisition
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
  file:
    name: logs/zastra-application.log

# Google Authenticator
google:
  client:
    id: ${GOOGLE_CLIENT_ID}
    secret: ${GOOGLE_CLIENT_SECRET}

facebook:
  client:
    id: ${FACEBOOK_CLIENT_ID}
    secret: ${FACEBOOK_CLIENT_SECRET}


